name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ldaca-web-app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check out source dependencies
        shell: bash
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          clone_source_dependency() {
            local repo_url="$1"
            local target="$2"

            if git ls-remote --exit-code --heads "$repo_url" "$REF_NAME" >/dev/null 2>&1; then
              git clone --depth 1 --branch "$REF_NAME" "$repo_url" "$target"
            else
              git clone --depth 1 --branch main "$repo_url" "$target"
            fi
          }

          clone_source_dependency \
            https://github.com/Australian-Text-Analytics-Platform/docworkspace.git \
            "$GITHUB_WORKSPACE/../docworkspace"
          clone_source_dependency \
            https://github.com/Australian-Text-Analytics-Platform/polars-text.git \
            "$GITHUB_WORKSPACE/../polars-text"
          clone_source_dependency \
            https://github.com/AlexDrBanana/polars-source-utils.git \
            "$GITHUB_WORKSPACE/../polars-source-utils"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          # Standard (GIL) CPython 3.14: Polars ships only cp310-abi3 wheels, so a
          # free-threaded "3.14t" interpreter has no matching wheel and would build
          # polars-runtime from source on every run. The desktop bundle stays 3.14t on
          # purpose; CI only needs to validate library logic, not the no-GIL runtime.
          python-version: "3.14"
          enable-cache: true
          cache-python: true

      - name: Extract frontend build archive
        shell: bash
        run: |
          FRONTEND_RES=src/ldaca_web_app/resources/frontend
          if [ -f "$FRONTEND_RES/build.tar.gz" ]; then
            tar -xzf "$FRONTEND_RES/build.tar.gz" -C "$FRONTEND_RES"
            echo "Frontend build extracted"
          else
            echo "No frontend archive found — skipping extraction"
          fi

      - name: Install dependencies
        shell: bash
        run: uv sync --frozen --group dev

      - name: Run tests
        shell: bash
        run: uv run pytest -q

      - name: Build distributions
        shell: bash
        run: uv build
