name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ldaca-wordflow-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out source dependencies
        shell: bash
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          clone_source_dependency() {
            local repo_url="$1"
            local target="$2"

            if git ls-remote --exit-code --heads "$repo_url" "$REF_NAME" >/dev/null 2>&1; then
              git clone --depth 1 --branch "$REF_NAME" "$repo_url" "$target"
            else
              git clone --depth 1 --branch main "$repo_url" "$target"
            fi
          }

          clone_source_dependency \
            https://github.com/Australian-Text-Analytics-Platform/polars-text.git \
            "$GITHUB_WORKSPACE/../polars-text"
          clone_source_dependency \
            https://github.com/AlexDrBanana/polars-source-utils.git \
            "$GITHUB_WORKSPACE/../polars-source-utils"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          # Standard CPython 3.14 matches the desktop runtime and published wheels.
          python-version: "3.14"
          enable-cache: true
          cache-python: true

      - name: Extract frontend build archive
        shell: bash
        run: |
          FRONTEND_RES=src/ldaca_wordflow/resources/frontend
          if [ -f "$FRONTEND_RES/build.tar.gz" ]; then
            tar -xzf "$FRONTEND_RES/build.tar.gz" -C "$FRONTEND_RES"
            echo "Frontend build extracted"
          else
            echo "No frontend archive found — skipping extraction"
          fi

      - name: Install dependencies
        id: install
        shell: bash
        run: uv sync --frozen --group dev

      - name: Run Ruff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: uv run ruff check .

      - name: Run Ty
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: uv run ty check

      - name: Run pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: uv run pytest -q

      - name: Export OpenAPI without runtime startup
        shell: bash
        run: |
          uv run python scripts/export_openapi.py --output "$RUNNER_TEMP/openapi.json"
          python - <<'PY'
          import json, os, pathlib

          schema = json.loads(
              (pathlib.Path(os.environ["RUNNER_TEMP"]) / "openapi.json").read_text()
          )
          operations = [
              operation
              for path in schema["paths"].values()
              for method, operation in path.items()
              if method in {"get", "post", "put", "patch", "delete"}
          ]
          operation_ids = [operation["operationId"] for operation in operations]
          assert len(operation_ids) == len(set(operation_ids))
          assert schema["paths"]["/health"]["get"]["responses"]["200"]["content"]
          PY

      - name: Build distributions
        shell: bash
        run: |
          uv build
          python - <<'PY'
          import pathlib, zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any("ldaca_wordflow/domain/workspace/analysis.py" in name for name in names)
              assert any("ldaca_wordflow/infrastructure/storage/workspace_store.py" in name for name in names)
              assert any("ldaca_wordflow/_vendor/gender_gap_tracker/quote_extractor.py" in name for name in names)
              assert any("ldaca_wordflow/_vendor/gender_gap_tracker/LICENSE" in name for name in names)
              assert not any(
                  "docworkspace" in name.casefold() or "rocrate_tabular" in name
                  for name in names
              )
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode("utf-8")
              for removed in (
                  "docworkspace",
                  "fastar",
                  "pyarrow",
                  "rocrate-tabular",
                  "tomli-w",
                  "xlsxwriter",
              ):
                  assert f"Requires-Dist: {removed}" not in metadata
          PY
